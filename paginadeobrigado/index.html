<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obrigado pela sua Compra! | Confirmação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Outfit:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #10b981; /* Success green */
      --primary-dark: #047857;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 0%, #d1fae5 0%, var(--bg) 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .thank-you-container {
      background: var(--card-bg);
      max-width: 550px;
      width: 100%;
      border-radius: 24px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08), 
                  0 0 0 1px rgba(0, 0, 0, 0.02);
      padding: 48px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      0% {
        transform: translateY(30px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Animated success checkmark wrapper */
    .success-animation {
      margin: 0 auto 30px;
      width: 90px;
      height: 90px;
      background: #ecfdf5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .success-circle {
      width: 90px;
      height: 90px;
      border: 4px solid var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: scaleIn 0.5s ease-out forwards;
    }

    .success-icon {
      font-size: 40px;
      color: var(--primary);
      animation: popIn 0.6s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform: scale(0);
      opacity: 0;
    }

    @keyframes scaleIn {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 36px;
      line-height: 1.2;
      margin-bottom: 16px;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 17px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 40px;
      font-weight: 400;
    }

    .info-card {
      background: #f1f5f9;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 40px;
      border: 1px dashed #cbd5e1;
      text-align: left;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .info-icon {
      font-size: 24px;
      color: var(--primary-dark);
      background: #ffffff;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .info-text {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .info-text strong {
      color: var(--text-main);
      display: block;
      margin-bottom: 2px;
    }

    /* High premium button */
    .btn-access {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 20px;
      padding: 20px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      cursor: pointer;
      margin-bottom: 30px;
      letter-spacing: 0.2px;
    }

    .btn-access:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px -5px rgba(16, 185, 129, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .btn-access:active {
      transform: translateY(-1px);
    }

    .btn-access i {
      font-size: 18px;
      transition: transform 0.2s;
    }

    .btn-access:hover i {
      transform: translateX(5px);
    }

    .secure-block {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
    }

    .secure-block i {
      color: var(--primary);
    }

    /* Decorative blobs */
    .blob {
      position: absolute;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
      border-radius: 50%;
      z-index: -1;
    }

    .blob-1 {
      top: -50px;
      right: -50px;
    }

    .blob-2 {
      bottom: -50px;
      left: -50px;
    }

    @media (max-width: 480px) {
      .thank-you-container {
        padding: 36px 20px;
      }
      h1 {
        font-size: 28px;
      }
      .subtitle {
        font-size: 15px;
      }
      .btn-access {
        font-size: 18px;
        padding: 18px 24px;
      }
    }
  </style>
</head>
<body>

  <div class="thank-you-container">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="success-animation">
      <div class="success-circle">
        <i class="fa-solid fa-check success-icon"></i>
      </div>
    </div>

    <h1>Compra Aprovada!</h1>
    
    <p class="subtitle">
      Obrigado pela sua preferência. Seu pedido foi processado com sucesso e seu acesso está liberado!
    </p>

    <div class="info-card">
      <div class="info-icon">
        <i class="fa-solid fa-envelope-open-text"></i>
      </div>
      <div class="info-text">
        <strong>Acesso ao Conteúdo</strong>
        Clique no botão abaixo para acessar imediatamente seu portal e desfrutar do material completo.
      </div>
    </div>

    <a href="https://jobquestentregavel.shop/diabetesfrances/" class="btn-access">
      ACESSAR MEU MATERIAL <i class="fa-solid fa-arrow-right"></i>
    </a>

    <div class="secure-block">
      <i class="fa-solid fa-shield-halved"></i>
      Ambiente Seguro & Criptografado
    </div>
  </div>

</body>
</html>
